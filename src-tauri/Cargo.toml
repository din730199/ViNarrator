[package]
name = "vinarrator"
version = "0.1.5"
description = "ViNarrator — thuyết minh game tiếng Việt"
authors = ["ViNarrator"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-global-shortcut = "2"
# Tự cập nhật qua GitHub Releases (chữ ký minisign) + relaunch sau khi cài.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Dịch -> VI: endpoint Google + API LLM OpenAI-compatible. blocking: gọi từ worker thread thường.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
urlencoding = "2"
# Bắt loopback (thiết bị PHÁT mở ở chế độ input) rồi nhận dạng tại chỗ.
# sherpa-onnx tự tải thư viện native prebuilt lúc build và link TĨNH — không cần cmake/libclang
# (đúng thứ đã làm piper-rs build hỏng), đổi lại exe to thêm ~20 MB.
cpal = "0.15"
sherpa-onnx = "1.13"
# Speechmatics: WebSocket bản ĐỒNG BỘ. Khâu nghe đã chạy trong thread riêng nên không cần
# tokio — bản async sẽ kéo theo cả runtime chỉ để phục vụ một socket.
tungstenite = { version = "0.24", default-features = false, features = [
  "handshake",
  "rustls-tls-webpki-roots",
] }

# Windows-only: TTS là WinRT nên app này chỉ chạy Windows (khai ở [dependencies] cho đúng).
# Media_Core: cần cho SynthesizeTextToStreamAsync. Win32_Media_Audio: PlaySoundW (thay winsound).
# Macro `implement` (loopback.rs dựng một đối tượng COM) sinh code trỏ thẳng vào `windows_core`,
# nên crate đó phải có tên ở đây chứ không mượn qua `windows::core` được.
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_Media_Audio",
  "Win32_System_Com",
  # Bắt loopback LOẠI TRỪ tiến trình mình (xem loopback.rs). ActivateAudioInterfaceAsync đòi
  # gói tham số vào PROPVARIANT kiểu VT_BLOB -> cần cả StructuredStorage lẫn Variant.
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # CloseHandle/HANDLE/WAIT_OBJECT_0 và CreateEventW/WaitForSingleObject của hàng đợi phát
  # (xem wave_out.rs).
  "Win32_Foundation",
  "Win32_System_Threading",
  # CreateEventW cần SECURITY_ATTRIBUTES -> phải bật kèm Win32_Security (xem wave_out.rs).
  "Win32_Security",
  # GetDiskFreeSpaceExW: kiểm đủ chỗ trước khi tải model (xem runtime.rs). Trước được bật ké
  # qua thư viện OCR, gỡ OCR là mất.
  "Win32_Storage_FileSystem",
] }
